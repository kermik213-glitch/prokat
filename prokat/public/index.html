<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПРОКАТ — Авторизация в системе</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        .login-card {
            background: #1f2937;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid #374151;
        }
        .login-logo {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .login-logo span {
            color: #a3e635;
        }
        .login-subtitle {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            margin-bottom: 24px;
        }
        .input-group label {
            font-size: 12px;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-group input {
            padding: 14px;
            background: #374151;
            border: 1px solid #4b5563;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }
        .input-group input:focus {
            border-color: #a3e635;
        }
        .login-submit-btn {
            background: #a3e635;
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .login-submit-btn:hover {
            filter: brightness(0.95);
        }
        .hint-text {
            font-size: 12px;
            color: #6b7280;
            margin-top: 16px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">⚡ПРОКАТ<span>.</span></div>
        <div class="login-subtitle">Единая система аутентификации сотрудников и клиентов</div>
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Введите кодовое слово или телефон</label>
                <input type="text" id="auth-keyword" placeholder="Имя, телефон или код роли" required autocomplete="off">
            </div>
            <button type="submit" class="login-submit-btn">Войти в систему</button>
        </form>
        <div class="hint-text">
            Служебный доступ для сотрудников: <strong>admin</strong> или <strong>manager</strong>. Клиенты входят по номеру своего телефона или ФИО.
        </div>
    </div>
    <script>
        function handleLogin(event) {
            event.preventDefault();
            const value = document.getElementById("auth-keyword").value.trim();
            const lowerValue = value.toLowerCase();
            if (lowerValue === 'admin') {
                window.location.href = 'admin.html';
            } else if (lowerValue === 'manager') {
                window.location.href = 'manager.html';
            } else {
                localStorage.setItem('client_session_identity', value);
                window.location.href = 'client.html';
            }
        }
    </script>
</body>
</html>
